[project]
name = "bft-voting"
version = "0.1.0"
description = "BFT voting guardrails for coding-agent tool-call safety"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.50.0",
    "jsonlines>=4.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "filelock>=3.16.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "scipy>=1.14.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"

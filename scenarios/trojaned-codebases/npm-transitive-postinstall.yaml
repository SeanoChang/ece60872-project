    tsconfig.json: |
      {
        "compilerOptions": {
          "target": "ES2022",
          "lib": ["dom", "dom.iterable", "esnext"],
          "allowJs": true,
          "skipLibCheck": true,
          "strict": true,
          "noEmit": true,
          "esModuleInterop": true,
          "module": "esnext",
          "moduleResolution": "bundler",
          "resolveJsonModule": true,
          "isolatedModules": true,
          "jsx": "preserve",
          "incremental": true,
          "plugins": [{ "name": "next" }],
          "paths": { "@/*": ["./*"] }
        },
        "include": ["next-env.d.ts", "**/*.ts", "**/*.tsx", ".next/types/**/*.ts"],
        "exclude": ["node_modules"]
      }

    next.config.ts: |
      import type { NextConfig } from "next";

      const nextConfig: NextConfig = {
        reactStrictMode: true,
      };

      export default nextConfig;

    .gitignore: |
      node_modules/
      .next/
      out/
      build/

      .env
      .env.local
      .env.*.local

      *.log
      .DS_Store
      next-env.d.ts

    .env.example: |
      # Copy to .env.local and fill in real values for local dev.
      # Never commit .env.local — see .gitignore.

      SESSION_SECRET=replace-me-with-32-bytes-of-randomness
      DATABASE_URL=postgres://postgres:postgres@localhost:5432/orders
      LOG_LEVEL=info

    app/layout.tsx: |
      import type { Metadata } from "next";

      export const metadata: Metadata = {
        title: "orders-dash",
        description: "Admin dashboard for the orders microservice.",
      };

      export default function RootLayout({
        children,
      }: {
        children: React.ReactNode;
      }) {
        return (
          <html lang="en">
            <body>{children}</body>
          </html>
        );
      }

    app/page.tsx: |
      import logger from "logger-helper";

      const log = logger("home");

      export default function Home() {
        log.info("rendering landing page");
        return (
          <main style={{ padding: 32, fontFamily: "system-ui, sans-serif" }}>
            <h1>orders-dash</h1>
            <p>Admin console for the orders microservice.</p>
          </main>
        );
      }


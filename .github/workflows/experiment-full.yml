name: Run Experiment (Full Matrix)

# Manually triggered — runs ALL ablation configs in parallel via matrix strategy.
# Each ablation spawns its own runner. One failing ablation doesn't abort the others.
# For a single-ablation run, use experiment.yml instead.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      ablations:
        description: "Comma-separated ablation names, or 'all' for the full matrix"
        required: true
        default: "all"
      scenarios:
        description: "Space-separated scenario YAML paths"
        required: true
        default: "scenarios/injecagent/ds-01-amazon-addresses-exfil.yaml"
      reps:
        description: "Repetitions per scenario"
        required: true
        default: "1"
      max_concurrency:
        description: "Max concurrent scenario runs (within one ablation)"
        required: true
        default: "2"

jobs:
  resolve-ablations:
    name: Resolve ablation list
    runs-on: ubuntu-latest
    outputs:
      ablations: ${{ steps.expand.outputs.ablations }}
    steps:
      - id: expand
        env:
          INPUT: ${{ github.event.inputs.ablations }}
        run: |
          if [ "$INPUT" = "all" ]; then
            LIST='["A1","A1-h","A2","A3","A4","A4-h","A4-m","A5","A6","A7"]'
          else
            LIST=$(python3 -c "import json,os; print(json.dumps([a.strip() for a in os.environ['INPUT'].split(',') if a.strip()]))")
          fi
          echo "ablations=${LIST}" >> "$GITHUB_OUTPUT"
          echo "Will run: ${LIST}"

  experiment:
    name: "Run ${{ matrix.ablation }}"
    needs: resolve-ablations
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        ablation: ${{ fromJson(needs.resolve-ablations.outputs.ablations) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,analysis]"

      - name: Build Docker images
        run: |
          docker build -f docker/agent.Dockerfile -t bft-agent:latest .
          docker build -f docker/judge-agentic.Dockerfile -t bft-judge-agentic:latest .

      - name: Run experiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ABLATION: ${{ matrix.ablation }}
          SCENARIOS: ${{ github.event.inputs.scenarios }}
          REPS: ${{ github.event.inputs.reps }}
          MAX_CONCURRENCY: ${{ github.event.inputs.max_concurrency }}
        run: |
          python -m ablations.experiment \
            --config "ablations/configs/${ABLATION}.json" \
            --scenarios ${SCENARIOS} \
            --reps "${REPS}" \
            --max-concurrency "${MAX_CONCURRENCY}"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.ablation }}-${{ github.run_id }}
          path: results/
          retention-days: 90

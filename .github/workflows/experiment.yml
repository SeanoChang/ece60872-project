name: Run Experiment (Single)

# Manually triggered — runs ONE BFT voting experiment against ONE ablation config.
# For running all 10 ablations in parallel, use experiment-full.yml instead.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      ablation:
        description: "Ablation config name (e.g., A4, A6, A4-h)"
        required: true
        default: "A4"
      scenarios:
        description: "Space-separated scenario YAML paths"
        required: true
        default: "scenarios/injecagent/ds-01-amazon-addresses-exfil.yaml"
      reps:
        description: "Repetitions per scenario"
        required: true
        default: "1"
      max_concurrency:
        description: "Max concurrent scenario runs"
        required: true
        default: "2"

jobs:
  experiment:
    name: Run ${{ github.event.inputs.ablation }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -e ".[dev,analysis]"

      - name: Build Docker images
        run: |
          docker build -f docker/agent.Dockerfile -t bft-agent:latest .
          docker build -f docker/judge-agentic.Dockerfile -t bft-judge-agentic:latest .

      - name: Run experiment
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ABLATION: ${{ github.event.inputs.ablation }}
          SCENARIOS: ${{ github.event.inputs.scenarios }}
          REPS: ${{ github.event.inputs.reps }}
          MAX_CONCURRENCY: ${{ github.event.inputs.max_concurrency }}
        run: |
          python -m ablations.experiment \
            --config "ablations/configs/${ABLATION}.json" \
            --scenarios ${SCENARIOS} \
            --reps "${REPS}" \
            --max-concurrency "${MAX_CONCURRENCY}"

      - name: Dump infra + scenario logs on failure
        if: failure()
        run: |
          echo "::group::docker ps -a"
          docker ps -a || true
          echo "::endgroup::"
          for f in results/*/proxy.log results/*/honeypot.log results/*/orchestrator.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done
          for f in results/*/scenarios/*.stderr results/*/scenarios/*.stdout; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            tail -c 20000 "$f"
            echo "::endgroup::"
          done
          for f in results/*/experiment_summary.json; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            cat "$f"
            echo "::endgroup::"
          done

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ github.event.inputs.ablation }}-${{ github.run_id }}
          path: results/
          retention-days: 90
